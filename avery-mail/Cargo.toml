[package]
name = "avery-mail"
version = "0.4.0"
edition = "2021"
description = "MCP server (stdio) for Apple Mail: reading, drafts and sending with approval. Rust port of libexec/avery-mail."
license = "MIT"
publish = false

# Standard library only: this list must stay empty.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
# A panic in a request handler is caught and turned into an error response,
# so unwinding must stay enabled.
panic = "unwind"
overflow-checks = true
