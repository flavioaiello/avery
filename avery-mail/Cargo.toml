[package]
name = "avery-mail"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
description = "MCP server (stdio) for private mail and calendars in Apple Mail and Calendar: reading, drafts, sending and calendar changes with approval."
license = "MIT"
publish = false

[dependencies]

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
overflow-checks = true
